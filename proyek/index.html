<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskSplit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Manrope:wght@600;700;800&family=Montserrat:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>TaskSplit</h1>
    <p>Bagi tugas kelompok, jadi lebih adil dan rapi!</p>
    <button type="button" class="tombol-suara" id="tombol-suara" aria-pressed="true">Suara: Nyala</button>
<audio id="bunyi-ting" src="aset/ding_sukses.mp3" preload="auto"></audio>
  </header>

  <!-- [BARU] Menu utama: tombol yang aktif ditandai aria-current="page" -->
  <nav class="menu">

  <button type="button" class="tab" data-pindah="anggota" aria-current="page">
    <svg class="ikon-tab" role="img" aria-label="Ikon anggota" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 1 1-7.5 0a3.75 3.75 0 0 1 7.5 0M4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.9 17.9 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632"/>
    </svg>
    Anggota
  </button>

  <button type="button" class="tab" data-pindah="tugas">
    <svg class="ikon-tab" role="img" aria-label="Ikon tugas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path fill="currentColor" d="M17.997 4.17A3 3 0 0 1 20 7v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 2.003-2.83A4 4 0 0 0 10 8h4a4 4 0 0 0 3.98-3.597zM15 15H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2m0-4H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2m-1-9a2 2 0 1 1 0 4h-4a2 2 0 1 1 0-4z"/>
    </svg>
    Bagi Tugas
  </button>

  <button type="button" class="tab" data-pindah="hasil">
    <svg class="ikon-tab" role="img" aria-label="Ikon hasil pembagian" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
        <path d="M17 21a5 5 0 0 0-10 0m15-10.5a3.5 3.5 0 0 0-5.507-2.868m-8.986 0A3.5 3.5 0 0 0 2 10.5"/>
        <circle cx="12" cy="13" r="3"/>
        <circle cx="18.5" cy="4.5" r="2.5"/>
        <circle cx="5.5" cy="4.5" r="2.5"/>
      </g>
    </svg>
    Hasil
  </button>

</nav>

  <main>

    <div class="tampilan" id="tampilan-anggota">
      <section class="kartu">
        <h2>Anggota kelompok</h2>
        <form id="form-anggota">
          <label for="nama-anggota">Nama anggota</label>
          <div class="baris">
            <input type="text" id="nama-anggota" maxlength="20" placeholder="Contoh: Daniela">
            <button type="submit" class="tombol">Tambah</button>
          </div>
          <p class="error" id="error-anggota"></p>
        </form>
        <div id="daftar-anggota"></div>
      </section>
      <button type="button" class="tombol tombol-besar" data-pindah="tugas">Lanjut ke Tugas</button>
    </div>

    <div class="tampilan" id="tampilan-tugas" hidden>
      <section class="kartu">
        <h2>Tugas baru</h2>
        <form id="form-tugas">
          <label for="nama-tugas">Pembagian tugas</label>
          <input type="text" id="nama-tugas" maxlength="40" placeholder="Contoh: Mencari Materi Untuk Docs">
          <p class="error" id="error-tugas"></p>

          <label for="deadline">Deadline</label>
          <input type="date" id="deadline">
          <p class="error" id="error-deadline"></p>

          <label for="pilih-anggota">Dikerjakan oleh</label>
          <select id="pilih-anggota"></select>
          <p class="info" id="info-anggota"></p>
          <p class="error" id="error-pilih"></p>

          <button type="submit" class="tombol tombol-besar" id="tombol-tugas">Bagikan tugas</button>
        </form>
      </section>
    </div>

    <div class="tampilan" id="tampilan-hasil" hidden>
      <section class="kartu">
        <h2>Hasil pembagian</h2>
        <div id="hasil"></div>
      </section>
    </div>

  </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
